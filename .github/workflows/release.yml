name: Release

# Tự động phát hành khi push tag dạng v* (vd v1.2.0).
# Thay cho winget/ký số (chưa khả dụng): build từ CI, công bố SHA256 và
# build provenance attestation để người dùng verify file đúng từ nguồn.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # tạo GitHub Release
  id-token: write        # cho attestation
  attestations: write    # ghi build provenance

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Materialize example config files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.config.example | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $dest = $_.FullName -replace '\.example$', ''
            if (-not (Test-Path $dest)) { Copy-Item $_.FullName $dest }
          }

      - name: Create placeholders for missing embedded resources
        shell: pwsh
        run: |
          $placeholder = [byte[]](0xFF,0xD8,0xFF,0xE0,0x00,0x10,0x4A,0x46,0x49,0x46,0x00,0x01,0x01,0x00,0x00,0x01,0x00,0x01,0x00,0x00,0xFF,0xD9)
          $paths = New-Object System.Collections.Generic.HashSet[string]
          Get-ChildItem -Recurse -Filter *.resx | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.claude|\.vs)\\' } | ForEach-Object {
            $resxDir = $_.Directory.FullName
            $xml = [xml](Get-Content $_.FullName -Raw)
            foreach ($data in $xml.root.data) {
              if ($data.value -and $data.value -match '^([^;]+);') {
                try { [void]$paths.Add([System.IO.Path]::GetFullPath((Join-Path $resxDir $Matches[1]))) } catch {}
              }
            }
          }
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) {
              $dir = Split-Path $p -Parent
              if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
              [System.IO.File]::WriteAllBytes($p, $placeholder)
            }
          }

      - name: Build Release
        shell: pwsh
        env:
          FX_REF: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8
        run: |
          $proj = (Get-ChildItem -Filter *.csproj | Select-Object -First 1).FullName
          nuget restore $proj -PackagesDirectory (Join-Path (Split-Path $proj) "packages")
          msbuild $proj /t:Restore /p:Configuration=Release
          msbuild $proj /p:Configuration=Release /p:FrameworkPathOverride="$env:FX_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage artifacts + SHA256
        id: stage
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path bin\Release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe built"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\
          if (Test-Path avlist.json) { Copy-Item avlist.json dist\ }
          # Zip theo tag.
          $tag = "${{ github.ref_name }}"
          $zip = "dist\AntiVirusFinderTool-$tag.zip"
          Compress-Archive -Path dist\*.exe, dist\avlist.json -DestinationPath $zip -Force
          # SHA256SUMS cho mọi file trong dist.
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.exe'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/avlist.json
          generate_release_notes: true
          fail_on_unmatched_files: false
